{% extends "base.html" %}

{% block title %}Create Account | EstateEase Luxury Real Estate{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-6 bg-white p-8 sm:p-10 rounded-3xl border border-slate-200/90 shadow-xl">
        
        <!-- Header -->
        <div class="text-center">
            <div class="w-12 h-12 rounded-2xl bg-navy text-gold flex items-center justify-center mx-auto mb-4 shadow-md">
                <i data-lucide="building-2" class="w-7 h-7 stroke-[2.2]"></i>
            </div>
            <h2 class="text-2xl font-bold font-serif text-navy tracking-tight">Join EstateEase</h2>
            <p class="text-xs text-slate-500 mt-1">Create an account to publish listings or connect with advisors.</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Full Name <span class="text-rose-500">*</span></label>
                <input type="text" name="full_name" required value="{{ form_data.full_name if form_data else '' }}" placeholder="e.g. Julian Montgomery" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-navy">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Username <span class="text-rose-500">*</span></label>
                    <input type="text" name="username" required value="{{ form_data.username if form_data else '' }}" placeholder="j_montgomery" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-navy">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Account Role</label>
                    <select name="role" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-navy bg-white">
                        <option value="agent">Real Estate Agent</option>
                        <option value="buyer">Private Buyer / Investor</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Email Address <span class="text-rose-500">*</span></label>
                <input type="email" name="email" required value="{{ form_data.email if form_data else '' }}" placeholder="julian@example.com" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-navy">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Phone Number (Optional)</label>
                <input type="tel" name="phone" value="{{ form_data.phone if form_data else '' }}" placeholder="+1 (555) 000-0000" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-navy">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Password <span class="text-rose-500">*</span></label>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-navy">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Confirm <span class="text-rose-500">*</span></label>
                    <input type="password" name="confirm_password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-navy">
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 rounded-xl bg-gold hover:bg-gold-hover text-navy font-bold text-xs uppercase tracking-wider transition shadow-lg shadow-gold/20 mt-2">
                Create Account
            </button>
        </form>

        <div class="text-center text-xs text-slate-500 pt-2">
            Already have an account? 
            <a href="{{ url_for('auth.login') }}" class="font-bold text-navy hover:text-gold transition">Sign In</a>
        </div>

    </div>
</div>
{% endblock %}
